[package]
name = "app"
version = "3.0.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
walkdir = "2.5.0"
kamadak-exif = "0.6.1"
lofty = "0.22.2"
chrono = "0.4.42"
anyhow = "1.0.100"
directories = "6.0.0"
filetime = "0.2.26"
tokio = { version = "1.48.0", features = ["full"] }
tauri-plugin-dialog = "2.4.2"
thiserror = "2.0.17"
# Eagle 本地 API（纯 http，无需 TLS）
ureq = { version = "2.12", default-features = false, features = ["json"] }
# 联机拍摄：文件夹监听 + 内置 FTP 服务器（相机 WiFi 直传）
notify = "6.1"
libunftp = "0.22"
unftp-sbe-fs = "0.3"
async-trait = "0.1"
if-addrs = "0.13"
# 内存中裁剪/编码 JPEG（RAW/HEIC 解码交给 macOS 自带 sips）
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
